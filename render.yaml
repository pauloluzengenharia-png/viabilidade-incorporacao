# Blueprint do Render — https://render.com/docs/blueprint-spec
#
# No dashboard: New → Blueprint → aponte para este repositório.
# O Render lê este arquivo, sobe o serviço web e liga a DATABASE_URL sozinho.
services:
  - type: web
    name: viabilidade
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /saude
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: viabilidade-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.9"
      # sem VIAB_SENHA o sistema sobe bloqueado, de proposito.
      # Defina o valor no painel (Environment) — ele nao mora no repositorio.
      - key: VIAB_USUARIO
        value: mmi
      - key: VIAB_SENHA
        sync: false

databases:
  - name: viabilidade-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
