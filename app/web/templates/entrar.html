<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · MMI Viabilidade</title>
<meta name="theme-color" content="#000000">
<link rel="icon" href="/static/mmi.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/estilo.css">
</head>
<body class="porta">
<div class="caixa">

  <div class="marca">{% include "_logo.html" %}</div>

  <h1>Viabilidade de incorporação</h1>
  <p class="sub">Os estudos e o incorrido das SPEs da MMI ficam atrás desta tela.</p>

  {% if erro %}
  <div class="erro">{{ erro }}</div>
  {% endif %}

  <form method="post" action="/entrar">
    <input type="hidden" name="de" value="{{ de }}">
    <label>Usuário
      <input type="text" name="usuario" value="{{ usuario or '' }}"
             autocomplete="username" autofocus required>
    </label>
    <label>Senha
      <input type="password" name="senha" autocomplete="current-password" required>
    </label>
    <button type="submit">Entrar</button>
  </form>

  <p class="rodape">
    A sessão vale por 12 horas. Trocar a senha no painel do serviço encerra
    todas as sessões abertas.
  </p>

</div>
</body>
</html>
